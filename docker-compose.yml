# Homelab deployment — modeled after the ld-clinica prod overlay, minus
# everything this app does not need (no Postgres, no MinIO, no migrate
# service, no auth env vars). The whole deploy is this one file:
#   docker compose up -d --build
#
# The app listens on 3000 inside the container (Nitro bun preset); only the
# host port is configurable via ${PORT} in .env (default 3077).
#
# gullsgabage-* is the intentional domain name: services, networks and
# containers keep these names — do not "fix" them to the repo name.

services:
  gullsgabage-app:
    build:
      context: .
      target: runner

    container_name: gullsgabage-app
    hostname: gullsgabage-app
    restart: always

    environment:
      NODE_ENV: production
      PORT: 3000

    # Host nginx terminates TLS and proxies here; never exposed directly.
    # See deploy/nginx/gullsgarba.ge.conf. Other homelab machines reach the app
    # through nginx too: pihole answers gullsgarba.ge with this box's LAN IP.
    ports:
      - 127.0.0.1:${PORT}:3000

    networks:
      - gullsgabage-network

    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Playable Unity WebGL builds live on the host and are served without a
      # rebuild. Drop a build into ./public/play/<slug>/ and `docker compose restart`.
      - ./public/play:/app/.output/public/play

networks:
  gullsgabage-network:
