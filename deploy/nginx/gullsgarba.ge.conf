# nginx site for gullsgarba.ge — reverse proxy to the Dockerized app, which
# publishes on 127.0.0.1:3077 only (see docker-compose.yml, ${PORT}).
#
# Install:
#   sudo bash /home/lurdo/astora/gullsgarbage/deploy/nginx/install-site.sh
#   sudo certbot --nginx -d gullsgarba.ge -d www.gullsgarba.ge
#
# certbot rewrites this file in place: it adds the listen 443 + ssl_certificate
# lines and an 80 -> 443 redirect. gullsgarba.ge is its own registrable domain,
# so it needs its own certificate — the astora.dev.br and kaima.dev.br certs
# cover nothing here.
#
# NOTE: the 'map $http_upgrade $connection_upgrade' block is intentionally
# omitted. nginx fails with a fatal "duplicate map directive" if it is declared
# more than once, and it is already declared in astora-links' site config
# (deploy/nginx/astora.dev.br.conf). One global declaration covers every server
# block, including this one.
#
# No client_max_body_size: this app has no upload path (no DB, no MinIO), so
# nginx's 1 MB default is not in the way of anything.

# www is not served directly — a single canonical origin keeps the serverFn
# CSRF same-origin check (src/start.ts) unambiguous. Redirect it instead.
server {
    server_name www.gullsgarba.ge;

    # The redirect lives in `location /`, not at server level: a server-level
    # `return` runs in the rewrite phase, before location selection, and would
    # swallow the /.well-known/acme-challenge/ block certbot injects here —
    # breaking issuance for this name. certbot's block is `^~`, so it wins over
    # `location /`. After issuance certbot moves the 301 to its own :80 block.
    location / {
        return 301 https://gullsgarba.ge$request_uri;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gullsgarba.ge/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gullsgarba.ge/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name gullsgarba.ge;

    location / {
        proxy_pass http://127.0.0.1:3077;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (relies on the map defined in astora.dev.br.conf)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gullsgarba.ge/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gullsgarba.ge/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = gullsgarba.ge) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name gullsgarba.ge;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}
server {
    if ($host = www.gullsgarba.ge) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name www.gullsgarba.ge;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}